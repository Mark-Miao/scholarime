[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarime"
version = "0.3.0"
description = "An auditable academic research agent toolkit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.optional-dependencies]
charts = ["Pillow>=10.0,<14"]
figures = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]
figure-pdf = ["PyMuPDF>=1.24,<2"]
ui = ["pywebview>=5.0,<7"]
excel = ["openpyxl>=3.1,<4"]
symbolic = ["sympy>=1.13,<2"]
workspace = [
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "pdf2image>=1.17,<2",
  "pytesseract>=0.3.13,<1",
]
stats = ["scipy>=1.13,<2", "statsmodels>=0.14,<1"]
writing = ["python-docx>=1.1,<2", "citeproc-py>=0.8,<1"]
all = [
  "Pillow>=10.0,<14",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "PyMuPDF>=1.24,<2",
  "pywebview>=5.0,<7",
  "openpyxl>=3.1,<4",
  "sympy>=1.13,<2",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "pdf2image>=1.17,<2",
  "pytesseract>=0.3.13,<1",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "python-docx>=1.1,<2",
  "citeproc-py>=0.8,<1",
]

[project.scripts]
scholarime = "scholarime.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["scholarime*"]

[tool.setuptools.package-data]
scholarime = [
  "SKILL.md",
  "agents/*.yaml",
  "assets/**/*",
  "formal/**/*",
  "install/**/*",
  "references/**/*",
  "vendor/**/*",
]
